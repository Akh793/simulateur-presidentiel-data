name: CI pipeline

on:
  push:
    paths: ["pipeline/**", "engine/**", "mobile-core/**", "mobile-app/**", "shared/**", "schema/**", "config/**", ".github/workflows/ci.yml"]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - run: pip install -r pipeline/requirements.txt
      - name: Tests unitaires (hors réseau)
        run: python3 -m pytest -q pipeline/tests
      - name: Schéma généré à jour (Pydantic -> JSON Schema + zod)
        run: python3 pipeline/gen_ts.py --check
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Vérification TypeScript de shared/schema.ts
        run: |
          mkdir -p /tmp/ts && cp shared/schema.ts /tmp/ts/ && cd /tmp/ts
          npm init -y >/dev/null && npm install --silent zod@3 typescript@5
          npx tsc --noEmit --strict --module nodenext --moduleResolution nodenext --target es2022 schema.ts

  engine:
    # Test bloquant : bornes spectrales de E et M, calendrier des flux, règles parlementaires,
    # mandat complet de 1 825 tours avec 200 décisions aléatoires.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: engine/package-lock.json
      - run: npm ci
      - name: Typage strict (tsc --noEmit)
        run: npm run typecheck
      - name: Tests (vitest)
        run: npm test

  mobile-core:
    # Persistance SQLite (node:sqlite, même interface qu'expo-sqlite), gabarits narratifs, validateur, Archives de Crise.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: mobile-core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mobile-core/package-lock.json
      - run: npm ci
      - name: Typage strict (tsc --noEmit)
        run: npm run typecheck
      - name: Tests (vitest)
        run: npm test

  mobile-app:
    # Typage strict (app + engine + mobile-core), tests de logique pure, prompts de la Style Bible à jour,
    # bundles Hermes Android et iOS (expo export : échoue si un module ne se résout pas).
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: mobile-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mobile-app/package-lock.json
      - run: npm ci
      - name: Typage strict (tsc --noEmit)
        run: npm run typecheck
      - name: Tests (vitest)
        run: npm test
      - name: Prompts de la Style Bible à jour
        run: |
          python3 -I assets-bible/build_prompts.py
          git diff --exit-code -- assets-bible/
      - name: Bundles Android et iOS
        env:
          CI: "1"
        run: npm run export:android && npm run export:ios
